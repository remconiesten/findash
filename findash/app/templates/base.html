<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <base id="app-base" href="{{ base|default('') }}/">
  <script>
  (function () {
    var el = document.getElementById("app-base");
    if ({{ (base or '')|tojson }}) return;
    var m = location.pathname.match(/^(\/api\/hassio_ingress\/[^/]+)/);
    if (m && el) el.setAttribute("href", m[1] + "/");
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.ui('app.title') }}</title>
  <link rel="icon" href="static/logo.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32.png">
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
  <link rel="stylesheet" href="static/css/app.css?v=18">
  <script src="static/js/htmx.min.js" defer></script>
  <script src="static/js/chart.umd.min.js" defer></script>
  <script src="static/js/charts.js?v=7" defer></script>
</head>
<body>
  <div class="page">
    <div class="chrome">
      <header class="top">
        <a class="brand" href=".">
          <img class="brand-mark" src="static/logo.svg" width="36" height="36" alt="">
          <span class="brand-name">FinDash</span>
        </a>
        <div class="top-right">
          {% block top_nav %}
          <a class="nav-studio" href="import-studio">{{ t.ui('studio.nav') }}</a>
          {% endblock %}
          {% set cycle_now = cycle|default('calendar') %}
          <form class="langs cycle-switch" method="post" action="cycle">
            <button type="submit" name="cycle" value="calendar"
                    class="{{ 'active' if cycle_now=='calendar' else '' }}"
                    title="{{ t.ui('cycle.calendar_title') }}"
                    aria-pressed="{{ 'true' if cycle_now=='calendar' else 'false' }}">{{ t.ui('cycle.calendar') }}</button>
            <button type="submit" name="cycle" value="salary"
                    class="{{ 'active' if cycle_now=='salary' else '' }}"
                    title="{{ t.ui('cycle.salary_title') }}"
                    aria-pressed="{{ 'true' if cycle_now=='salary' else 'false' }}">{{ t.ui('cycle.salary') }}</button>
          </form>
          <form class="langs" method="post" action="locale">
            <button type="submit" name="lang" value="nl" class="{{ 'active' if locale=='nl' else '' }}" title="{{ t.ui('lang.nl') }}" aria-pressed="{{ 'true' if locale=='nl' else 'false' }}">NL</button>
            <button type="submit" name="lang" value="en" class="{{ 'active' if locale=='en' else '' }}" title="{{ t.ui('lang.en') }}" aria-pressed="{{ 'true' if locale=='en' else 'false' }}">EN</button>
            <button type="submit" name="lang" value="ru" class="{{ 'active' if locale=='ru' else '' }}" title="{{ t.ui('lang.ru') }}" aria-pressed="{{ 'true' if locale=='ru' else 'false' }}">RU</button>
          </form>
        </div>
      </header>
      {% block toolbar %}{% endblock %}
    </div>
    {% block body %}{% endblock %}
  </div>
</body>
</html>
