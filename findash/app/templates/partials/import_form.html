<form class="import-form" method="post" action="{{ base|default('') }}/import-studio/preview" enctype="multipart/form-data">
  <div class="field">
    <span class="field-label">{{ t.ui('import.bank_csv') }}</span>
    <input type="file" name="bank_csv" accept=".csv,text/csv">
  </div>
  <div class="field">
    <span class="field-label">{{ t.ui('import.cc_pdf') }}</span>
    <input type="file" name="cc_pdf" accept="application/pdf,.pdf">
  </div>
  <div class="field field-submit">
    <button type="submit" class="tx-close">{{ t.ui('import.preview') }}</button>
  </div>
  <p class="import-wait" hidden role="status" aria-live="polite">
    <progress aria-hidden="true"></progress>
    <span>{{ t.ui('import.wait_preview') }}</span>
  </p>
</form>
<p class="hint-quiet">{{ t.ui('import.hint') }}</p>
